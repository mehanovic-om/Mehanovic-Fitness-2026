<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MF Fitness">
<title>Mehanovic Fitness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: one quiet 640px column. Glass segmented nav on top, a large-title day
     header with an activity ring, inset grouped lists per circuit, a floating
     glass rest timer at the bottom. Montenegrin crimson and gold are the only color. */
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --line: rgba(0, 0, 0, 0.09);
    --fill: rgba(118, 118, 128, 0.13);
    --glass: rgba(245, 245, 247, 0.74);
    --panel: rgba(255, 255, 255, 0.82);
    --red: #b5121b;
    --gold: #9a7400;
    --on-red: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --float: 0 10px 40px rgba(0,0,0,.18);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1c1c1e; --fg: #f5f5f7; --muted: #98989f;
      --line: rgba(255,255,255,0.11); --fill: rgba(118,118,128,0.26);
      --glass: rgba(10,10,12,0.72); --panel: rgba(36,36,40,0.82);
      --red: #e0333c; --gold: #e2bd4a; --on-red: #ffffff;
      --shadow: none; --float: 0 10px 40px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --fg: #f5f5f7; --muted: #98989f;
    --line: rgba(255,255,255,0.11); --fill: rgba(118,118,128,0.26);
    --glass: rgba(10,10,12,0.72); --panel: rgba(36,36,40,0.82);
    --red: #e0333c; --gold: #e2bd4a; --on-red: #ffffff;
    --shadow: none; --float: 0 10px 40px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  :root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 120px;
    transition: background-color .3s ease, color .3s ease;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap {
    max-width: 640px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ── Brand ── */
  .brand { padding-block: 22px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark { width: 44px; height: 18px; flex: none; }
  .bb-bar { fill: var(--gold); }
  .bb-plate { fill: var(--red); }
  .brand-name { font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .brand-name span { color: var(--red); }
  .brand-tag { font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    background: var(--fill); display: grid; place-items: center;
    transition: transform .15s ease, background-color .2s ease;
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Segmented nav ── */
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
    background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .nav .wrap { padding-block: 8px; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill); overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button {
    flex: 1 0 auto; padding: 7px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted); white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: background-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .seg button[aria-selected="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--red); opacity: 0; transition: opacity .25s, background-color .25s; }
  .pip.on { opacity: 1; }
  .pip.full { background: var(--gold); }

  /* ── Day page ── */
  .page { animation: rise .35s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { opacity: .0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 28px 6px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--red); letter-spacing: 0.02em; }
  .day-title { font-family: var(--display); font-size: clamp(40px, 12vw, 56px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; margin: 2px 0 6px; text-wrap: balance; }
  .day-sub { font-size: 15px; color: var(--muted); }

  .ring { position: relative; width: 76px; height: 76px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--fill); }
  .ring .arc { stroke: var(--red); stroke-linecap: round; transition: stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1), stroke .3s; }
  .ring.complete .arc { stroke: var(--gold); }
  .ring-num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-variant-numeric: tabular-nums; }
  .ring-num b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .ring-num small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }

  .note {
    margin-top: 18px; padding: 12px 16px; border-radius: 14px;
    background: var(--fill); color: var(--muted); font-size: 14px; line-height: 1.45;
  }

  .group { margin-top: 26px; }
  .group-head { display: flex; align-items: baseline; gap: 8px; padding: 0 16px 8px; }
  .group-head h3 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); }
  .group-head span { font-size: 13px; color: var(--muted); }
  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; height: 1px; background: var(--line); }
  .row.has-badge + .row.has-badge::before { left: 52px; }

  .badge {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
    background: var(--red); color: var(--on-red);
  }
  .badge.hollow { background: transparent; color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold); }
  .ex { flex: 1; min-width: 0; }
  .ex-name { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
  .ex-reps { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ex-note { font-size: 12px; color: var(--muted); opacity: .85; }
  .row.done .ex-name { color: var(--muted); }

  .sets { display: flex; gap: 6px; flex: none; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
  .set {
    min-width: 34px; height: 34px; border-radius: 17px; padding: 0 4px;
    display: grid; place-items: center; position: relative;
    background: var(--fill); color: var(--muted);
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    transition: background-color .2s ease, transform .15s ease, color .2s ease;
  }
  .set.wide { padding: 0 12px; font-size: 12px; }
  .set:active { transform: scale(.88); }
  .set svg { position: absolute; width: 15px; height: 15px; stroke: var(--on-red); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.5); transition: opacity .18s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  .set[aria-pressed="true"] { background: var(--red); color: transparent; }
  .set[aria-pressed="true"] svg { opacity: 1; transform: none; }

  .banner {
    margin-top: 26px; padding: 22px 16px; border-radius: 18px; text-align: center;
    background: var(--card); box-shadow: var(--shadow);
    animation: pop .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  .banner-check { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 10px; background: var(--gold); display: grid; place-items: center; }
  .banner-check svg { width: 22px; height: 22px; stroke: var(--card); fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .banner b { display: block; font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .banner span { font-size: 14px; color: var(--muted); }

  .reset { display: block; margin: 22px auto 0; padding: 8px 16px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--red); transition: background-color .2s; }
  .reset:hover { background: var(--fill); }
  .legend { margin-top: 18px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-flex; align-items: center; gap: 6px; font-style: normal; }
  .legend .badge { width: 14px; height: 14px; }

  /* ── Emblem ── */
  .emblem { width: 200px; max-width: 100%; margin: 56px auto 0; display: block; }
  .emblem .e-gold { stroke: var(--gold); fill: none; }
  .emblem .e-line { stroke: var(--line); fill: none; }
  .emblem text { font-family: var(--display); }
  .emblem .t-top { fill: var(--fg); font-size: 11px; font-weight: 700; letter-spacing: 3px; }
  .emblem .t-bot { fill: var(--muted); font-size: 7.5px; font-weight: 600; letter-spacing: 2.2px; }
  .emblem .t-mid { fill: var(--muted); font-size: 7.5px; font-weight: 600; letter-spacing: 3px; }
  .emblem .e-dot { fill: var(--gold); }

  /* ── Rest timer ── */
  .dock {
    position: fixed; z-index: 70; left: 0; right: 0;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .glass {
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--float);
    -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  }
  .rest-pill { display: inline-flex; align-items: center; gap: 9px; padding: 12px 20px; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; transition: transform .15s; }
  .rest-pill:active { transform: scale(.95); }
  .rest-pill svg { width: 17px; height: 17px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rest-pill small { font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }

  .rest-panel { width: 100%; max-width: 420px; border-radius: 28px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px; animation: up .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }
  .t-ring { width: 48px; height: 48px; flex: none; transform: rotate(-90deg); }
  .t-ring circle { fill: none; stroke-width: 5; }
  .t-ring .track { stroke: var(--fill); }
  .t-ring .arc { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .3s; }
  .urgent .t-ring .arc { stroke: var(--red); }
  .t-mid { flex: 1; min-width: 0; }
  .t-label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .t-time { font-family: var(--display); font-size: 32px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; transition: color .3s; }
  .urgent .t-time { color: var(--red); }
  .t-btns { display: flex; gap: 6px; flex: none; }
  .t-btns .icon-btn { width: 40px; height: 40px; }
  .t-btns .icon-btn.primary { background: var(--red); color: var(--on-red); }
  .t-btns .icon-btn.primary svg { fill: currentColor; stroke: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="barbell" viewBox="0 0 64 26">
    <rect class="bb-bar" x="2" y="11.5" width="60" height="3" rx="1.5"/>
    <rect class="bb-plate" x="7" y="6" width="4.5" height="14" rx="2"/>
    <rect class="bb-plate" x="13" y="1" width="5.5" height="24" rx="2.5"/>
    <rect class="bb-plate" x="45.5" y="1" width="5.5" height="24" rx="2.5"/>
    <rect class="bb-plate" x="52.5" y="6" width="4.5" height="14" rx="2"/>
  </symbol>
</svg>

<header class="wrap brand">
  <div class="brand-id">
    <svg class="brand-mark" aria-hidden="true"><use href="#barbell"/></svg>
    <div>
      <div class="brand-name">Mehanovic <span>Fitness</span></div>
      <div class="brand-tag">Forged in the Black Mountains</div>
    </div>
  </div>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch appearance"></button>
</header>

<nav class="nav" aria-label="Workout days">
  <div class="wrap"><div class="seg" id="seg" role="tablist"></div></div>
</nav>

<main class="wrap" id="main"></main>

<div class="wrap">
  <svg class="emblem" viewBox="0 0 240 240" role="img" aria-label="Mehanovic Fitness emblem">
    <defs>
      <path id="arcTop" d="M 20,120 A 100,100 0 0 1 220,120"/>
      <path id="arcBot" d="M 13,120 A 107,107 0 0 0 227,120"/>
    </defs>
    <circle class="e-gold" cx="120" cy="120" r="118" stroke-width="1.5"/>
    <circle class="e-line" cx="120" cy="120" r="90" stroke-width="1"/>
    <text class="t-top"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">MEHANOVIC FITNESS</textPath></text>
    <text class="t-bot"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">FORGED IN THE BLACK MOUNTAINS</textPath></text>
    <circle class="e-dot" cx="16" cy="120" r="2"/><circle class="e-dot" cx="224" cy="120" r="2"/>
    <use href="#barbell" x="68" y="88" width="104" height="42"/>
    <text class="t-mid" x="120" y="156" text-anchor="middle">PERSONAL TRAINING</text>
  </svg>
</div>

<div class="dock">
  <button class="rest-pill glass" id="restPill" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
    Rest <small>1:00</small>
  </button>
  <div class="rest-panel glass" id="restPanel" hidden>
    <svg class="t-ring" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="track" cx="24" cy="24" r="20"/>
      <circle class="arc" id="tArc" cx="24" cy="24" r="20"/>
    </svg>
    <div class="t-mid">
      <div class="t-label" id="tLabel">Rest</div>
      <div class="t-time" id="tTime" aria-live="off">1:00</div>
    </div>
    <div class="t-btns">
      <button class="icon-btn" id="tRestart" type="button" aria-label="Restart timer"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/></svg></button>
      <button class="icon-btn primary" id="tToggle" type="button" aria-label="Pause"></button>
      <button class="icon-btn" id="tClose" type="button" aria-label="Close timer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</div>

<script>
(function () {
  /* ── Program ── [name, reps, note, sets]  (sets: a count, or a list of labels) */
  var LIFT_NOTE = 'On the big lifts, stop 1–2 reps short of failure. The rest timer starts on its own after each round: 2 min for compound circuits, 1 min for isolation.';
  var DAYS = [
    { id: 'push', tab: 'Push', tag: 'Day 1', title: 'Push', sub: 'Chest · Shoulders · Triceps', done: 'Push day complete', noteBefore: LIFT_NOTE, groups: [
      { c: 'A', name: 'Chest & Side Delts', solid: true, ex: [['Bench Press', '8 reps', '', 3, 'c'], ['Lateral Raises', '12–15 reps', '', 3, 'i']] },
      { c: 'B', name: 'Shoulders & Chest', solid: true, ex: [['Shoulder Press', '8 reps', '', 3], ['Dumbbell Flyes', '10 reps', 'or cable flyes at different angles when possible', 3]] },
      { c: 'C', name: 'Upper Chest & Side Delts', solid: true, ex: [['Incline Dumbbell Press', '8–10 reps', 'flat bench only? use tight grip bench', 3, 'c'], ['Cable Lateral Raises', '12–15 reps', '', 3, 'i']] },
      { c: 'D', name: 'Tricep Finisher', ex: [['Cable Overhead Extensions', '10–12 reps', 'deep stretch at the bottom', 3], ['Tricep Pushdowns', '10–12 reps', '', 3]] },
      { c: 'E', name: 'Final', ex: [['Push Ups', 'To failure', '', ['Set 1']]] }
    ]},
    { id: 'pull', tab: 'Pull', tag: 'Day 2', title: 'Pull', sub: 'Back · Traps · Biceps', done: 'Pull day complete', noteBefore: LIFT_NOTE, groups: [
      { c: 'A', name: 'Vertical & Horizontal Pull', solid: true, ex: [['Pull-Ups', '6 reps', '', 3], ['Dumbbell Rows', '8 reps', '', 3]] },
      { c: 'B', name: 'Lats & Traps', solid: true, ex: [['Lat Pulldown', '10 reps', 'preferred: single arm pulldowns via cable', 3], ['Barbell Shrugs', '10–12 reps', '', 3]] },
      { c: 'C', name: 'Rear Delts, Biceps & Calves', ex: [['Face Pulls', '10 reps', '', 3], ['Hammer Curls', '12 reps', '', 3], ['Calf Raises', '12 reps', 'on a plate edge, pause in the bottom stretch', 3]] },
      { c: 'D', name: 'Forearms & Grip Finisher', ex: [['Barbell Curls', '8–10 reps', '', 3], ['Forearm Curls', '12–15 reps', '', 3], ['Barbell Rotation', '3 × 30 sec', 'switch grip mid-set', 3], ['Dead Hang', 'To failure', '', ['Hang']]] },
      { c: 'E', name: 'Final', ex: [['Preacher Curls', 'To failure', '', ['Set 1', 'Set 2', 'Set 3']]] }
    ]},
    { id: 'legs', tab: 'Legs', tag: 'Day 3', title: 'Legs', sub: 'Quads · Hamstrings · Calves', done: 'Leg day complete', noteBefore: LIFT_NOTE, groups: [
      { c: 'A', name: 'Quads, Calves & Hamstrings', solid: true, ex: [['Barbell Squat', '6 reps', '', 3], ['Calf Raises', '12 reps', 'on a plate edge, pause in the bottom stretch, finish with bottom-half reps', 4], ['Leg Curls', '10–12 reps', 'one leg at a time with the ankle strap', 4]] },
      { c: 'B', name: 'Hinge & Unilateral', solid: true, ex: [['Cable Pull-Throughs', '12–15 reps', 'hinge at the hips, squeeze glutes at the top', 3], ['Walking Lunges', '6 reps / leg', '', 3]] },
      { c: 'C', name: 'Quad & Glute Isolation', ex: [['Leg Extensions', '12–15 reps', '', 3], ['Glute Extensions', '12–15 reps', '', 3]] },
      { c: 'D', name: 'Hamstring Finisher', ex: [['Nordic Curls', '4–8 slow reps', 'heels under the loaded bar, lower as slowly as you can', 3]] }
    ]},
    { id: 'full', tab: 'Full Body', tag: 'Day 4', title: 'Full Body', sub: 'Second weekly hit for every muscle', done: 'Full body complete',
      noteAfter: 'Lower volume by design. This is the second time each muscle gets trained this week, so focus on quality reps, not chasing PRs.', groups: [
      { c: 'A', name: 'Lower & Push', solid: true, ex: [['Barbell Squat', '6 reps', '', 2], ['Bench Press', '8 reps', '', 2]] },
      { c: 'B', name: 'Hamstrings & Pull', solid: true, ex: [['Leg Curls', '10–12 reps', '', 3], ['Weighted Pull-Ups / Rows', '6 reps', '', 2]] },
      { c: 'C', name: 'Upper Body Isolation', ex: [['Shoulder Press', '8 reps', '', 2], ['Hammer Curls', '12 reps', '', 2], ['Tricep Pushdowns', '10 reps', '', 2], ['Calf Raises', '12 reps', '', 3]] }
    ]},
    { id: 'abs', tab: 'Abs', tag: 'Every other day', title: 'Abs', sub: '8–10 min · 2–3 rounds', done: 'Abs done',
      noteBefore: 'Run as a circuit with no rest between exercises. Rest 60–90 sec between rounds.', groups: [
      { c: '', name: '2–3 rounds', label: 'Circuit', rest: 90, ex: [['Plank', '45–60 sec', '', 3], ['Hanging Leg Raises', '10–12 reps', '', 3], ['Ab Wheel Rollouts', '8–10 reps', '', 3], ['Bicycle Crunches', '20 reps', '', 3], ['Dead Bug', '10 reps / side', '', 3]] }
    ]}
  ];

  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var RING_C = 2 * Math.PI * 30;

  /* ── Storage (per-browser convenience; the page works without it) ── */
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  var KEY = 'mf-sets-v3';
  var state = load(KEY, {});          // { push: { "0": true, ... } }
  var current = load('mf-day', 'push');
  if (!DAYS.some(function (d) { return d.id === current; })) current = 'push';

  var main = document.getElementById('main');
  var seg = document.getElementById('seg');

  function totals(day) {
    var total = 0;
    day.groups.forEach(function (g) { g.ex.forEach(function (e) { total += Array.isArray(e[3]) ? e[3].length : e[3]; }); });
    var s = state[day.id] || {}, done = 0;
    for (var k in s) if (s[k] && +k < total) done++;
    return { total: total, done: done };
  }

  /* ── Tabs ── */
  DAYS.forEach(function (d) {
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'tab-' + d.id; b.setAttribute('role', 'tab');
    b.innerHTML = esc(d.tab) + '<i class="pip" id="pip-' + d.id + '"></i>';
    b.addEventListener('click', function () { show(d.id); });
    seg.appendChild(b);
  });

  function paintPips() {
    DAYS.forEach(function (d) {
      var t = totals(d), p = document.getElementById('pip-' + d.id);
      p.classList.toggle('on', t.done > 0);
      p.classList.toggle('full', t.done === t.total);
    });
  }

  /* ── Page ── */
  function show(id) {
    current = id; save('mf-day', id);
    var day = DAYS.filter(function (d) { return d.id === id; })[0];
    DAYS.forEach(function (d) { document.getElementById('tab-' + d.id).setAttribute('aria-selected', d.id === id ? 'true' : 'false'); });
    var s = state[id] || {}, n = 0, hasBadges = false;

    var h = '<section class="page">' +
      '<div class="day-head"><div><div class="eyebrow">' + esc(day.tag) + '</div>' +
      '<h1 class="day-title">' + esc(day.title) + '</h1><div class="day-sub">' + esc(day.sub) + '</div></div>' +
      '<div class="ring" id="ring"><svg viewBox="0 0 76 76" aria-hidden="true"><circle class="track" cx="38" cy="38" r="30"/>' +
      '<circle class="arc" id="ringArc" cx="38" cy="38" r="30" stroke-dasharray="' + RING_C + '" stroke-dashoffset="' + RING_C + '"/></svg>' +
      '<div class="ring-num"><div><b id="ringPct">0%</b><small id="ringCount"></small></div></div></div></div>';

    if (day.noteBefore) h += '<p class="note">' + esc(day.noteBefore) + '</p>';

    day.groups.forEach(function (g, gi) {
      if (g.c) hasBadges = true;
      h += '<div class="group"><div class="group-head"><h3>' + esc(g.label || ('Circuit ' + g.c)) + '</h3><span>' + esc(g.name) + '</span></div><div class="card">';
      g.ex.forEach(function (e) {
        var labels = Array.isArray(e[3]) ? e[3] : null, count = labels ? labels.length : e[3];
        h += '<div class="row' + (g.c ? ' has-badge' : '') + '">';
        if (g.c) h += '<div class="badge' + ((e[4] ? e[4] === 'c' : g.solid) ? '' : ' hollow') + '">' + esc(g.c) + '</div>';
        h += '<div class="ex"><div class="ex-name">' + esc(e[0]) + '</div><div class="ex-reps">' + esc(e[1]) + '</div>' +
          (e[2] ? '<div class="ex-note">' + esc(e[2]) + '</div>' : '') + '</div><div class="sets">';
        for (var i = 0; i < count; i++, n++) {
          var lab = labels ? labels[i] : String(i + 1);
          h += '<button type="button" class="set' + (labels ? ' wide' : '') + '" data-i="' + n + '" data-g="' + gi + '" data-r="' + i + '" aria-pressed="' + (s[n] ? 'true' : 'false') +
            '" aria-label="' + esc(e[0]) + ', ' + esc(labels ? lab : 'set ' + lab) + '">' + esc(lab) + CHECK + '</button>';
        }
        h += '</div></div>';
      });
      h += '</div></div>';
    });

    if (day.noteAfter) h += '<p class="note">' + esc(day.noteAfter) + '</p>';
    h += '<div class="banner" id="banner" hidden><div class="banner-check">' + CHECK + '</div><b>' + esc(day.done) + '</b><span>Every set checked off. Nice work.</span></div>';
    h += '<button type="button" class="reset" id="resetBtn">Reset workout</button>';
    if (hasBadges) h += '<div class="legend"><i><span class="badge"></span>Compound</i><i><span class="badge hollow"></span>Isolation</i></div>';
    h += '</section>';
    main.innerHTML = h;

    main.querySelectorAll('.row').forEach(markRow);
    document.getElementById('resetBtn').addEventListener('click', function () {
      state[id] = {}; save(KEY, state); show(id);
    });
    requestAnimationFrame(function () { paintProgress(day, false); });
    paintPips();
  }

  function markRow(row) {
    var all = row.querySelectorAll('.set'), on = row.querySelectorAll('.set[aria-pressed="true"]');
    row.classList.toggle('done', all.length > 0 && all.length === on.length);
  }

  function paintProgress(day, announce) {
    var t = totals(day), frac = t.total ? t.done / t.total : 0;
    document.getElementById('ringArc').style.strokeDashoffset = RING_C * (1 - frac);
    document.getElementById('ringPct').textContent = Math.round(frac * 100) + '%';
    document.getElementById('ringCount').textContent = t.done + ' of ' + t.total;
    document.getElementById('ring').classList.toggle('complete', frac === 1);
    var banner = document.getElementById('banner'), was = banner.hidden;
    banner.hidden = frac !== 1;
    if (announce && was && frac === 1) banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  main.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.set'); if (!btn) return;
    var on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    state[current] = state[current] || {};
    if (on) state[current][btn.dataset.i] = true; else delete state[current][btn.dataset.i];
    save(KEY, state);
    markRow(btn.closest('.row'));
    var day = DAYS.filter(function (d) { return d.id === current; })[0];
    paintProgress(day, true);
    paintPips();
    /* Auto-rest: when this round of the circuit is checked off on every exercise */
    if (on) {
      var round = main.querySelectorAll('.set[data-g="' + btn.dataset.g + '"][data-r="' + btn.dataset.r + '"]');
      var roundDone = Array.prototype.every.call(round, function (b) { return b.getAttribute('aria-pressed') === 'true'; });
      var t = totals(day), g = day.groups[+btn.dataset.g];
      if (roundDone && t.done < t.total) startRest(g.rest || (g.solid ? 120 : 60));
    }
  });

  /* ── Appearance ── */
  var root = document.documentElement, themeBtn = document.getElementById('themeBtn');
  var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function paintTheme() { themeBtn.innerHTML = isDark() ? SUN : MOON; themeBtn.setAttribute('aria-label', isDark() ? 'Switch to light appearance' : 'Switch to dark appearance'); }
  var savedTheme = load('mf-theme', null);
  if (savedTheme === 'light' || savedTheme === 'dark') root.setAttribute('data-theme', savedTheme);
  themeBtn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next); save('mf-theme', next); paintTheme();
  });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch (e) {} }
  new MutationObserver(paintTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  paintTheme();

  /* ── Rest timer (60 s) ── */
  var TOTAL = 60, T_C = 2 * Math.PI * 20;
  var pill = document.getElementById('restPill'), panel = document.getElementById('restPanel');
  var tArc = document.getElementById('tArc'), tTime = document.getElementById('tTime'), tLabel = document.getElementById('tLabel');
  var tToggle = document.getElementById('tToggle');
  var PAUSE = '<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>';
  var remaining = TOTAL, endAt = 0, tick = null, mode = 'idle'; // idle | running | paused | done
  tArc.setAttribute('stroke-dasharray', T_C);

  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function paintTimer() {
    var secs = Math.ceil(remaining);
    tArc.style.strokeDashoffset = T_C * (1 - Math.max(remaining, 0) / TOTAL);
    panel.classList.toggle('urgent', secs <= 10);
    tTime.textContent = mode === 'done' ? 'Go' : fmt(secs);
    tLabel.textContent = mode === 'done' ? 'Rest over' : mode === 'paused' ? 'Paused' : 'Rest · ' + fmt(TOTAL);
    tToggle.innerHTML = mode === 'running' ? PAUSE : PLAY;
    tToggle.setAttribute('aria-label', mode === 'running' ? 'Pause' : mode === 'done' ? 'Start again' : 'Resume');
  }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
  function run() {
    mode = 'running'; endAt = Date.now() + remaining * 1000; stopTick();
    tick = setInterval(function () {
      remaining = (endAt - Date.now()) / 1000;
      if (remaining <= 0) {
        remaining = 0; mode = 'done'; stopTick();
        if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
      }
      paintTimer();
    }, 200);
    paintTimer();
  }
  function restart() { remaining = TOTAL; run(); }

  function startRest(secs) { TOTAL = secs; pill.hidden = true; panel.hidden = false; restart(); }
  pill.addEventListener('click', function () { startRest(60); });
  document.getElementById('tRestart').addEventListener('click', restart);
  tToggle.addEventListener('click', function () {
    if (mode === 'running') { remaining = Math.max((endAt - Date.now()) / 1000, 0); mode = 'paused'; stopTick(); paintTimer(); }
    else if (mode === 'done') restart();
    else run();
  });
  document.getElementById('tClose').addEventListener('click', function () {
    stopTick(); mode = 'idle'; remaining = TOTAL; paintTimer(); panel.hidden = true; pill.hidden = false;
  });

  show(current);
})();
</script>
</body>
</html>
